foldableProjectView.settings.patternsFile.comment=Space-separated paths of the files with the patterns, relative to the module content root, like: .foldignore .dockerignore
foldableProjectView.settings.patternsFile.help.title=Patterns files
foldableProjectView.settings.patternsFile.help=Every line of a file is a single gitignore-like pattern matched relative to the module content root; blank lines and lines starting with <code>#</code> are skipped.<br>Each module uses the files found in its own content root; the files are watched, so edits apply immediately.
