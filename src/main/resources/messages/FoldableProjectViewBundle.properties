foldableProjectView.name=Foldable Project View
foldableProjectView.settings.foldingEnabled=Enable folding
foldableProjectView.settings.foldingEnabled.comment=Fold matching root elements of the project modules in the Project View.
foldableProjectView.settings.matchDirectories=Also fold directories
foldableProjectView.settings.matchDirectories.comment=Apply the folding rules to directories as well as to files. Patterns ending with a slash, like `build/`, match directories only.
foldableProjectView.settings.foldNestedDirectories=Fold in nested directories
foldableProjectView.settings.foldNestedDirectories.comment=Apply the folding rules to the content of all directories, not only to the module roots. Patterns starting with a slash, like `/README.md`, still match root elements only. Ignored files and empty groups are folded in the module roots only.
foldableProjectView.settings.hideEmptyGroups=Hide empty groups
foldableProjectView.settings.hideEmptyGroups.comment=Hide folding groups if they contain no matched elements.
foldableProjectView.settings.caseSensitive=Case-sensitive
foldableProjectView.settings.caseSensitive.comment=Distinguish between lowercase and uppercase letters. If disabled, `README*` will match: `README.md` and `Readme.txt`
foldableProjectView.settings.foldingRules=Folding Rules
foldableProjectView.settings.name=Name
foldableProjectView.settings.name.placeholder=Group label shown in the Project View
foldableProjectView.settings.name.empty=Enter a name for the rule; the group is labeled "Unnamed rule" otherwise
foldableProjectView.settings.background=Background
foldableProjectView.settings.foreground=Foreground
foldableProjectView.settings.patterns=Patterns
foldableProjectView.settings.patterns.comment=Space-separated glob patterns, like: README.md *.yml gradle*. Start a pattern with ! to exclude the matched elements, end it with / to match directories only, and wrap names containing spaces in double quotes.
foldableProjectView.settings.patterns.invalid=Invalid patterns are skipped: {0}
foldableProjectView.settings.patterns.placeholder=README.md *.yml gradle*
foldableProjectView.settings.patterns.empty=No patterns
foldableProjectView.settings.patterns.empty.tooltip=The rule has no patterns and is not applied
foldableProjectView.settings.matches.root=Matches {0,choice,0#no elements|1#one element|1<{0,number,integer} elements} in the module roots
foldableProjectView.settings.matches.nested=Matches {0,choice,0#no elements|1#one element|1<{0,number,integer} elements} in the project
foldableProjectView.settings.matches.limit=Matches more than {0,number,integer} elements in the project
foldableProjectView.settings.presets=Presets
foldableProjectView.settings.presets.empty=New Rule
foldableProjectView.settings.presets.docs=Documentation
foldableProjectView.settings.presets.ci=CI/CD
foldableProjectView.settings.presets.build=Build
foldableProjectView.settings.presets.config=Configuration
foldableProjectView.settings.presets.dotfiles=Dotfiles
foldableProjectView.settings.type=Source
foldableProjectView.settings.type.comment=Match by the patterns entered below, or by the patterns read from ignore-like files located in the module content roots, like `.foldignore` or `.dockerignore`.
foldableProjectView.settings.type.pattern=Patterns
foldableProjectView.settings.type.patternsFile=File
foldableProjectView.settings.patternsFile=Files
foldableProjectView.settings.patternsFile.comment=Space-separated paths of the files with the patterns, relative to the module content root, like: .foldignore .dockerignore. Every line of a file is a single gitignore-like pattern; blank lines and lines starting with # are skipped.
foldableProjectView.settings.patternsFile.notFound=Not found in any module content root: {0}
foldableProjectView.settings.patternsFile.placeholder=.foldignore .dockerignore
foldableProjectView.settings.action=Action
foldableProjectView.settings.action.tooltip=Rules marked with the eye icon hide the matched elements instead of grouping them
foldableProjectView.settings.action.comment=Group the matched elements into a folding group, or hide them from the Project View entirely.
foldableProjectView.settings.action.group=Group
foldableProjectView.settings.action.hide=Hide
foldableProjectView.settings.action.hide.tooltip=Matched elements are hidden from the Project View
foldableProjectView.settings.enabled=Enabled
foldableProjectView.settings.enabled.tooltip=Disabled rules are kept, but not applied. The built-in Ignored files rule cannot be removed, only disabled
foldableProjectView.settings.color=Color
foldableProjectView.settings.color.tooltip=Foreground and background colors of the folding group
foldableProjectView.settings.color.comment=Named colors follow the IDE theme and the File Colors settings; a custom color is used as is in both the light and dark themes.
foldableProjectView.settings.color.custom=Custom\u2026
foldableProjectView.settings.color.blue=Blue
foldableProjectView.settings.color.green=Green
foldableProjectView.settings.color.orange=Orange
foldableProjectView.settings.color.rose=Rose
foldableProjectView.settings.color.violet=Violet
foldableProjectView.settings.color.yellow=Yellow
foldableProjectView.settings.color.gray=Gray
foldableProjectView.settings.defaults.store=Use as Defaults for New Projects
foldableProjectView.settings.defaults.load=Copy from Defaults
foldableProjectView.settings.defaults.comment=Projects without stored settings start with the defaults. The defaults are changed only when you store them explicitly; they are synchronized by Settings Sync and can also be edited in the settings for new projects.
foldableProjectView.settings.defaults.description=These settings are used for the projects that have no Foldable Project View settings stored yet. They are synchronized by Settings Sync.
foldableProjectView.ignoredFiles=Ignored files
foldableProjectView.unnamedRule=Unnamed rule
foldableProjectView.ignoredFiles.description=Files and folders ignored by the VCS
foldableProjectView.patternsFile.description=Patterns from {0}
foldableProjectView.settings.support=Support Foldable Project View
foldableProjectView.settings.support.comment=If you find this plugin useful, support its development via <a href="https://github.com/sponsors/hsz">GitHub Sponsors</a>, <a href="https://ko-fi.com/hszanowski">Ko-fi</a>, or <a href="https://paypal.me/hsz">PayPal</a>. You can also find my other projects on <a href="https://github.com/hsz">GitHub</a>.
