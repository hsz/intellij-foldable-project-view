foldableProjectView.settings.patterns=Patterns
foldableProjectView.settings.patterns.label=&Patterns
foldableProjectView.settings.patterns.comment=Space-separated glob patterns, like: README.md *.yml gradle*
foldableProjectView.settings.patterns.help.title=Pattern syntax
foldableProjectView.settings.patterns.help=<code>*</code> matches any characters but <code>/</code>, <code>**</code> matches any number of directories, <code>?</code> matches a single character, <code>[abc]</code> matches one of the listed characters.<br>Patterns containing a slash, like <code>/README.md</code> or <code>src/*.md</code>, are matched relative to the module root; the others match on any level.<br>Start a pattern with <code>!</code> to exclude the matched elements; as in gitignore, the last matching pattern decides.<br>End a pattern with <code>/</code> to match directories only.<br>Wrap names containing spaces in double quotes, like <code>"My Notes.md"</code>.
