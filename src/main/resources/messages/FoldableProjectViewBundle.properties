foldableProjectView.settings.ruleSets.description=Rules can also live in YAML files: `.foldableprojectview.yaml` in the project root or a module content root (versioned with the project), and `rules.yaml` in the user directory (applied to every project). The files are merged with the settings below; the rules of the files are read-only here, except for the Enabled checkbox.
